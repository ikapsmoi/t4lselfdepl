<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-new.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover curated group adventures, music festival trips, creator journeys and India experiences with Travel4life." />
    <meta name="author" content="Travel4life" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="Travel4life | Group Adventures, Festival Trips and Hosted Travel" />
    <meta property="og:description" content="Discover curated group adventures, music festival trips, creator journeys and India experiences with Travel4life." />
    <meta property="og:image" content="https://travel4life.net/findyourtribe1.jpg" />
    <meta property="og:url" content="https://travel4life.net/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Travel4life" />
    <meta property="og:locale" content="en_US" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Travel4life | Group Adventures, Festival Trips and Hosted Travel" />
    <meta name="twitter:description" content="Discover curated group adventures, music festival trips, creator journeys and India experiences with Travel4life." />
    <meta name="twitter:image" content="https://travel4life.net/findyourtribe1.jpg" />
    <meta name="twitter:site" content="@travel4life" />
    <meta name="twitter:creator" content="@travel4life" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#eab308" />
    <link rel="canonical" href="https://travel4life.net/" />

    <title>Travel4life | Group Adventures, Festival Trips and Hosted Travel</title>
    
    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.pexels.com">
    <link rel="preconnect" href="https://api.dicebear.com">
    <link rel="dns-prefetch" href="https://api.dicebear.com">
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@id": "https://travel4life.net/#organization",
      "@type": ["Organization", "TravelAgency"],
      "name": "Travel4life",
      "alternateName": "Travel4life Group Adventures",
      "description": "Host trips and travel free or join epic group adventures. Music festivals, themed travel, backpacking trips worldwide. Small groups, verified hosts, authentic experiences.",
      "url": "https://travel4life.net/",
      "logo": {
        "@type": "ImageObject",
        "url": "https://travel4life.net/logo-new.png",
        "width": 1429,
        "height": 1007
      },
      "image": "https://travel4life.net/findyourtribe1.jpg",
      "telephone": "+91 9871-621-921",
      "email": "info@travel4life.net",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "New Delhi",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91 9871-621-921",
        "email": "info@travel4life.net",
        "contactType": "customer support",
        "areaServed": "IN",
        "availableLanguage": ["en", "hi"]
      },
      "knowsAbout": [
        "International music festival travel",
        "Festival travel packages",
        "Group travel",
        "India travel experiences"
      ],
      "sameAs": [
        "https://www.instagram.com/travel4life_net/",
        "https://www.facebook.com/thetravellersstore/",
        "https://t.me/secret_miles_channel",
        "https://wa.link/ghfcus"
      ],
      "areaServed": "Worldwide"
    }
    </script>

    <!-- Website entity -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://travel4life.net/#website",
      "name": "Travel4life",
      "url": "https://travel4life.net/",
      "description": "A platform for group travel adventures and hosted travel experiences.",
      "publisher": {
        "@id": "https://travel4life.net/#organization"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx" defer></script>
  </body>
</html>
